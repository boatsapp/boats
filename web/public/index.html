<style>
/* Layout: one narrow phone column, quiet grey surfaces, ink-black primary actions, orange only for live/PR/rest moments. */
:root{
  --bg:#F5F5F3; --surface:#FFFFFF; --surface-2:#EEEDEA; --line:#E3E2DE;
  --fg:#1B1B1A; --muted:#6F6D68; --faint:#A6A39D;
  --accent:#2E9FD8; --accent-soft:#E1F1FA; --streak:#F2541B; --streak-soft:#FDE9E0; --good:#2F9E62; --good-soft:#E2F3E9; --warn:#E3A008; --bad:#D2452E; --bad-soft:#FBE6E2; --miss:#C46A5C; --miss-soft:#F6E7E3;
  --display:"Inter Tight","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --tab-h:84px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121211; --surface:#1C1C1B; --surface-2:#262624; --line:#2E2D2B;
  --fg:#EDECE8; --muted:#9C9992; --faint:#66635E;
  --accent:#5BC0EB; --accent-soft:#12303F; --streak:#FF6A2E; --streak-soft:#3A2116; --good:#4FC283; --good-soft:#173324; --warn:#F5C451; --bad:#FF6B55; --bad-soft:#3A1C17; --miss:#B85A4D; --miss-soft:#2B1D1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121211; --surface:#1C1C1B; --surface-2:#262624; --line:#2E2D2B;
  --fg:#EDECE8; --muted:#9C9992; --faint:#66635E;
  --accent:#5BC0EB; --accent-soft:#12303F; --streak:#FF6A2E; --streak-soft:#3A2116; --good:#4FC283; --good-soft:#173324; --warn:#F5C451; --bad:#FF6B55; --bad-soft:#3A1C17; --miss:#B85A4D; --miss-soft:#2B1D1A; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:18px;height:18px}
svg.i.xs{width:14px;height:14px}

.screen{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(var(--tab-h) + 28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.h1{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:-.02em;line-height:1.1;margin:0;text-wrap:balance}
.h2{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.01em;margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:10px}
.rowx{display:flex;align-items:center;gap:12px}
.spacer{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;text-align:left}
.li+.li{border-top:1px solid var(--line)}
.li .t{font-weight:600} .li .s{font-size:13px;color:var(--muted)}
.li .grow{flex:1;min-width:0}
.ico{width:40px;height:40px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;color:var(--fg);flex:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 20px;border-radius:14px;font-weight:600;font-size:16px;width:100%;border:1px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:700}
.btn:not(.sm){flex-shrink:0}

.link{color:var(--muted);font-weight:500;font-size:14px}

.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:2px}
.chipscroll{position:relative}.chipscroll .chips{padding-right:44px;touch-action:pan-x;overscroll-behavior-x:contain;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 56px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 56px),transparent)}.chipscroll.end .chips{-webkit-mask-image:none;mask-image:none}.chipmore{position:absolute;right:0;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--fg);pointer-events:none;transition:opacity .2s}.chipscroll.end .chipmore{opacity:0}
.chips::-webkit-scrollbar{display:none}
.chip{height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;white-space:nowrap;color:var(--muted)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}

.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tag{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:8px;background:var(--surface-2);font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em;white-space:nowrap}
.tag.accent{background:var(--accent-soft);color:var(--accent)}
.tag.good{background:var(--good-soft);color:var(--good)}

.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font-size:13px;font-weight:600;color:var(--muted)}
.input,.select{height:50px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:17px;width:100%;min-width:0}
.select{appearance:none;-webkit-appearance:none;font-size:16px;font-weight:600;padding-right:40px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 15px) 22px;background-size:5px 5px;background-repeat:no-repeat}
.input:focus,.select:focus{outline:none;border-color:var(--fg)}
.inwrap{position:relative;flex:1;min-width:0}
.inwrap .suf{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:50px;height:50px;border-radius:12px;background:var(--surface-2);font-size:22px;font-weight:500;flex:none}
.stepper .input{text-align:center;font-weight:600}
.stepper.mini button{width:40px;height:44px}
.stepper.mini .input{height:44px;padding:0 4px}

.toggle{position:relative;width:46px;height:28px;border-radius:14px;background:var(--line);flex:none;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s}
.toggle.on{background:var(--good)}
.toggle.on::after{transform:translateX(18px)}

.range{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.range input{width:100%;accent-color:var(--fg);height:28px}
.ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:500}
.ticks span:nth-child(2){color:var(--fg);font-weight:700}
.bigtime{font-family:var(--display);font-weight:700;font-size:36px;letter-spacing:-.02em;line-height:1}

/* splash */
.splash{max-width:440px;margin:0 auto;display:flex;flex-direction:column;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:14vh 40px}
.mark{font-family:var(--display);font-weight:900;font-size:clamp(72px,24vw,112px);letter-spacing:-.05em;line-height:.88;margin:0 0 0 -4px}
.mark-sub{margin:18px 0 0;font-size:21px;font-weight:600;letter-spacing:-.015em;line-height:1.25;color:var(--fg);max-width:20ch;font-family:var(--display)}
.acro{margin:0 0 14px;font-size:clamp(10px,3.15vw,14px);font-weight:500;line-height:1.35;color:var(--muted);white-space:nowrap}
.auth{display:flex;flex-direction:column;gap:10px;padding-top:52px}
.dotst{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block}
.dotst.ok{background:var(--good)} .dotst.warn{background:var(--accent)}
.fine{font-size:12.5px;color:var(--faint);text-align:center;margin:6px 0 0}
.soon{font-size:11px;font-weight:600;color:var(--faint);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:4px}
.fadein{animation:fade .5s ease both}
@keyframes fade{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}

/* onboarding */
.progress{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.progress i{height:4px;border-radius:2px;background:var(--line)}
.progress i.on{background:var(--fg)}
.goal{display:flex;gap:14px;align-items:flex-start;text-align:left;padding:16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);width:100%}
.goal.on{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.goal .radio{width:22px;height:22px;border-radius:50%;border:1.75px solid var(--faint);flex:none;margin-top:1px;display:grid;place-items:center}
.goal.on .radio{border-color:var(--fg)}
.goal.on .radio::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--fg)}
.footer-actions{display:flex;gap:10px}
.footer-actions .btn.primary{flex:1;width:auto;min-width:0;height:52px;border-radius:12px}
.footer-actions .btn:not(.primary){height:52px;width:52px;padding:0;border-radius:12px}
.reps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.reps button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;min-width:0}
.reps b{font-family:var(--display);font-size:20px}
.reps .rl{font-weight:600;font-size:14px}
.reps .rd{font-size:12px;color:var(--muted)}
.reps .rrec{margin-top:4px;font-size:11px;font-weight:700;color:var(--good);letter-spacing:.02em}
.stepper.mini{min-width:0}.stepper.mini .input{min-width:0}
.reps button.on{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.lvl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.lvl button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:var(--surface);min-width:0}
.lvl b{font-size:14px;font-weight:600}
.lvl span{font-size:11.5px;color:var(--muted)}
.lvl button.on{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.clock.idle{color:var(--faint)}
.cmt{display:flex;flex-direction:column;gap:4px;padding:4px 0}
.cmt.sub{padding-left:22px}
.cmrow{display:flex;align-items:flex-start;gap:8px}
.cmtx{flex:1;min-width:0;font-size:14px;line-height:1.35;overflow-wrap:anywhere}
.cmheart{flex:none;background:none;border:0;padding:3px;color:var(--muted)}
.cmheart.on{color:var(--bad)}
.cmheart.on svg{fill:currentColor}
.cmmeta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;line-height:1.6}
.cmmeta .link{font-size:12px;color:var(--muted);font-weight:600;padding:0}
.cmreps{font-size:12.5px;color:var(--muted);padding:4px 0 4px 22px;align-self:flex-start}
.cmbox{display:flex;align-items:center;gap:8px;margin-top:6px}
.cmfield{position:relative;flex:1;min-width:0}
.cmfield .input{width:100%;padding-right:62px}
.cmfield .cmpost{position:absolute;right:6px;top:50%;transform:translateY(-50%);height:32px;padding:0 10px;border:0;border-radius:10px;background:none;color:var(--accent);font-weight:700;font-size:14px}
.cmbox .input{height:42px;font-size:16px}
.cmpost{font-weight:700;color:var(--accent)}
.li.dimday{opacity:.45}
body.kbopen .chatbar{padding-bottom:6px!important}
body.kbopen .chatwrap .chatpage{padding-bottom:0!important}
#behind{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:var(--bg);transform:translateX(-22%);filter:blur(6px) brightness(.6)}
#behind .bh-in{will-change:transform}

body.swipeback{background:var(--bg)!important;overflow:hidden;touch-action:none}html:has(body.swipeback){overflow:hidden}
.popstar{font-size:12px;margin-left:4px}.wkrow{align-items:center}.wkflame{color:var(--streak);display:grid}.wkthumb{width:44px;height:55px;object-fit:cover;border-radius:8px;flex:none}
.instchk{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:none;color:var(--fg);font:inherit;font-weight:600;text-align:left}.instchk.on{border-color:var(--good)}.instchk.on .ckbox{background:var(--good);border-color:var(--good);color:#fff}.instchk:disabled{opacity:.5}.instchk.nudge{animation:nudge .4s}@keyframes nudge{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.instwarn{font-size:13px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--streak) 14%,transparent);color:var(--fg)}
.modbox{border-style:dashed}.modw summary{cursor:pointer;list-style:none}.modw .exline{padding:4px 0}.modmsg{padding:4px 0;border-top:1px solid var(--line);font-size:14px;word-break:break-word}
.rangenote{display:block;font-size:12px;color:var(--bad);margin-top:4px}
.ckrow{display:flex;gap:10px;align-items:flex-start}.ckbox{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;margin-top:1px}.ckrow.ok .ckbox{background:var(--good);border-color:var(--good);color:#fff}
.splitchips{display:grid;grid-template-columns:1fr 1fr;gap:8px}.splitchip{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;text-align:left}.splitchip b{font-size:15px}.splitchip small{font-size:11.5px;color:var(--muted);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.splitchip.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}.splitchip .rtag{font-size:10px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}

.dmicon{position:relative}

.likerlist{padding-top:4px}

  if(['incline-walk','run'].includes(id)||/tread|walk|run|jog/.test(n)) return 'tread';
  if(['elliptical','bike','rower'].includes(id)||/ellip|olyp|bike|cycl|row|spin/.test(n)) return 'res';
  if(id==='stairmaster'||/stair|step/.test(n)) return 'level'; return 'level'; }
function heightCm(){ return Pf.unit==='lb'?((num(Pf.ft)||5)*12+(num(Pf.inch)||0))*2.54:(num(Pf.cm)||175); }
// Mifflin-St Jeor resting burn per kg vs the 1 kcal/kg/h a MET assumes: makes calorie estimates fit your sex, height and weight.
function bmr(){ const kg=bodyKg(); return 10*kg+6.25*heightCm()-5*30+(Pf.sex==='female'?-161:5); }
function metCorr(){ if(!Pf.sex) return 1; return Math.max(0.7,Math.min(1.15,bmr()/(bodyKg()*24))); }
function bodyKg(){ const bw=num(Pf.bodyweight)||(Pf.unit==='lb'?170:77); return Pf.unit==='lb'?bw*0.4536:bw; }
function cardioKcal(it,minutes){ return Math.round(cardioKcal0(it,minutes)*metCorr()); }
function cardioKcal0(it,minutes){
  const kg=bodyKg(), c=it.cset||{}, k=cardioKind(it.exId), n=(exOf(it.exId).n||'').toLowerCase(); let perMin;
  if(k==='fixed'){ const met=(FIXED_MET[it.exId]||5)*({easy:.75,mod:1,hard:1.25}[c.int||'mod']); return Math.round(met*3.5*kg/200*minutes); }
  if(k==='tread'){ const sp=num(c.speed)||3, mpm=Pf.unit==='lb'?sp*26.82:sp*16.67, g=(num(c.incline)||0)/100, run=Pf.unit==='lb'?sp>=4.5:sp>=7.2;
    const vo2=run?0.2*mpm+0.9*mpm*g+3.5:0.1*mpm+1.8*mpm*g+3.5; perMin=vo2*kg/1000*5; }
  else { const lv=Math.min(20,num(k==='res'?c.res:c.level)||5); let met;
    if(it.exId==='bike'||/bike|cycl|spin/.test(n)) met=4+0.35*lv; else if(it.exId==='rower'||/row/.test(n)) met=6+0.2*lv; else if(k==='level') met=Math.min(14,7+0.4*lv); else met=5+0.3*lv;
    perMin=met*3.5*kg/200; }
  return Math.round(perMin*minutes);
}

function normalizeProfile(p){
  const base=defaultProfile();
  if(!p) return base;
  if(!p.username && p.name) p.username=p.name;
  for(const k in base) if(p[k]===undefined) p[k]=base[k];
  p.show=Object.assign({},base.show,p.show||{}); p.targets=Object.assign({},base.targets,p.targets||{});
  { const OLD={x_upper:'push',x_chest:'push',x_back:'pull',x_shoulders:'push',x_chestback:'push',x_shoarms:'arms'}; if(p.customTypes) for(const k of Object.keys(OLD)) if(k in p.customTypes){ delete p.customTypes[k]; } if(p.split) for(const [d,t] of Object.entries(p.split)) if(OLD[t]) p.split[d]=OLD[t]; }
  for(const [k] of DAYS){ p.plans[k]=p.plans[k]||[]; p.split[k]=p.split[k]||'rest'; } if(p.onboarded&&p.defaultsTouched==null) p.defaultsTouched=true;
  if(p.v<2){ p.repMin=7; p.repMax=10; p.rest=90; if(p.onboarded) p.onboarded=false; p.v=2; }
  if(!p.bwLog.length && num(p.bodyweight)) p.bwLog.push({t:Date.now(),w:num(p.bodyweight)});
  if(p.active) for(const it of p.active.items){ it.repMin=it.repMin||p.repMin; it.repMax=it.repMax||p.repMax; for(const s of it.sets){ if(s.st===undefined) s.st=s.done?'ok':null; delete s.done; } }
  return p;
}

const Store = {
  mode:'connecting', note:'', col:null, db:null, uid:null, acct:null, profiles:{}, all:[], profile:null, workouts:[], t:null, writing:false, dirty:false,
  docId(a=this.acct){ return a==='main'?'profile':'profile_'+a; },
  cache(){ lsSet('boats.v5',{profiles:this.profiles,all:this.all}); },
  loadCache(){
    const c=lsGet('boats.v5');
    if(c){ this.profiles=c.profiles||{}; this.all=c.all||[]; }
    lsDel('boats.v3'); lsDel('boats.v4'); lsDel('boats.profile'); lsDel('boats.workouts');
  },
  async init(){
    if(PREVIEW){ this.mode='preview'; this.note=''; return; }
    this.loadCache();
    try{
      if(!window.claude||!claude.use){ this.mode='local'; this.note='Not opened from Claude'; return; }
      const [db,user] = await withTimeout(Promise.all([claude.use('db'),claude.use('user')]),8000);
      if(!db||!user){ this.mode='local'; this.note='Storage unavailable'; return; }
      const id = await withTimeout(user.id(),8000); if(!id){ this.mode='local'; this.note='Not signed in'; return; }
      this.db=db; this.uid=id;
      const col = db.collection('data/users/'+id);
      const snap = await withTimeout(col.get(),10000);
      const profiles={}, all=[];
      snap.docs.forEach(d=>{ const raw=d.data(); if(!raw) return; const x=clone(raw);   // stored data comes back read-only
        if(d.id==='profile') profiles.main=x; else if(d.id.startsWith('profile_')) profiles[d.id.slice(8)]=x;
        else if(x.kind==='workout') all.push({...x,acct:x.acct||'main'}); });
      this.col=col; this.mode='cloud';
      // push up anything only saved on this device
      for(const a in this.profiles) if(!profiles[a]){ try{ await col.doc(this.docId(a)).set(clone(this.profiles[a])); profiles[a]=this.profiles[a]; }catch(e){} }

function streak(){
  const qual=Store.workouts.filter(countsForStreak);

  if(!done.size) return 0;
  const first=Math.min(...qual.map(w=>w.startedAt));

function bestSet(item){ let b=null; for(const s of item.sets){ const w=num(s.w),r=num(s.r); if(!b||w>b.w||(w===b.w&&r>b.r)) b={w,r}; } return b; }
function lastTime(exId,equip,before=Infinity){
  for(const w of Store.workouts){ if(w.startedAt>=before) continue; const it=w.items.find(i=>i.exId===exId&&i.equip===equip&&i.sets.length); if(it) return {set:bestSet(it),unit:w.unit||Pf.unit}; }
  return null;
}
function lastItem(exId,equip){ for(const w of Store.workouts){ const it=w.items.find(i=>i.exId===exId&&i.equip===equip&&i.sets.length); if(it) return it; } return null; }
function volume(w){ let v=0,n=0; for(const it of w.items){ if(it.cardio) continue; for(const s of it.sets){ v+=num(s.w)*num(s.r); n++; } } return {v,n}; }
function prsFor(w){
  const out=new Set();
  for(const it of w.items){ if(it.cardio||!it.sets.length) continue; const b=bestSet(it); if(!b||!b.w) continue;
    let prev=0, seen=false; for(const o of Store.workouts){ if(o.startedAt>=w.startedAt) continue; const x=o.items.find(i=>i.exId===it.exId&&i.equip===it.equip); if(x){ seen=true; for(const s of x.sets) prev=Math.max(prev,num(s.w)); } }
    if(seen && b.w>prev) out.add(keyOf(it.exId,it.equip)); }
  return out;
}

// overall strength: each lift's weekly best estimated 1-rep max vs its first week (=100), averaged across the lifts done that week
function strengthIndex(){

function cardioLogMin(it){ const el=cardioEl(it); return Math.max(1,Math.round((el>=30000?el:(num(it.min)||20)*60000)/60000)); }
function cardioCard(it,i){
  const target=(num(it.min)||20)*60000, el=cardioEl(it), done=it.sets[0]&&it.sets[0].st==='ok', k=cardioKind(it.exId), c=it.cset||{};
  const R=52, C=2*Math.PI*R, frac=Math.min(1,el/target), over=el>target;
  const field=(key,label,suf,mode='decimal')=>`<div class="field"><label for="cs-${i}-${key}">${label}</label><div class="inwrap"><input class="input num" id="cs-${i}-${key}" inputmode="${mode}" placeholder="0" value="${esc(c[key]||'')}" data-cset="${i}.${key}">${suf?`<span class="suf">${suf}</span>`:''}</div></div>`;
  const settings = k==='fixed' ? `<div class="field"><span class="flabel">Effort</span><div class="seg" role="radiogroup">${[['easy','Easy'],['mod','Moderate'],['hard','Hard']].map(([v,l])=>`<button class="${(c.int||'mod')===v?'on':''}" data-a="c-int" data-v="${i}.${v}" role="radio" aria-checked="${(c.int||'mod')===v}">${l}</button>`).join('')}</div></div>`
    : k==='tread' ? `<div class="grid2">${field('speed','Speed',Pf.unit==='lb'?'mph':'km/h')}${field('incline','Incline','%')}</div>`
    : k==='res' ? field('res','Resistance','level','numeric') : field('level','Level','','numeric');
  if(done) return `<div class="card" style="background:var(--good-soft);border-color:transparent"><div class="rowx"><span class="ico" style="background:var(--good);color:#fff">${ic('check','sm')}</span><div style="flex:1;min-width:0"><b>${esc(it.sets[0].w)} min logged</b><div class="muted small">About ${it.kcal||cardioKcal(it,num(it.sets[0].w))} kcal (estimate)</div></div><div class="stepper mini" style="flex:none"><button data-a="c-adj" data-v="${i}" data-d="-1" aria-label="1 minute less">−</button><input class="input num" value="${esc(it.sets[0].w)}" readonly aria-label="Minutes logged"><button data-a="c-adj" data-v="${i}" data-d="1" aria-label="1 minute more">+</button></div></div><button class="link" style="align-self:flex-start;margin-top:8px" data-a="c-undo" data-v="${i}">Undo</button></div>${settings}`;
  return `<div class="cardio">
    <div class="ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="${R}" class="ring-bg"/><circle cx="60" cy="60" r="${R}" class="ring-fg ${over?'over':''}" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}" data-cring="${i}"/></svg>
      <div class="ring-txt"><div class="clock num" data-cleft="${i}">${over?'+'+fmtUp(el-target):fmtClock(target-el)}</div><div class="muted small">${over?'past goal':'of '+(num(it.min)||20)+' min'}</div></div></div>
    <div class="rowx" style="gap:8px;width:100%"><button class="btn primary" style="flex:1" data-a="c-toggle" data-v="${i}">${ic(it.tRun?'pause':'play','sm')}${it.tRun?'Pause':el?'Resume':'Start'}</button>${el&&!it.tRun?`<button class="btn" style="width:auto;flex:none" data-a="c-reset" data-v="${i}" aria-label="Reset timer">${ic('reset','sm')}</button>`:''}</div>
    <div class="grid2" style="width:100%"><div class="field"><span class="flabel">Goal</span><div class="stepper mini"><button data-a="c-min" data-v="${i}" data-d="-5" aria-label="5 minutes less">−</button><input class="input num" value="${num(it.min)||20}" readonly aria-label="Goal minutes"><button data-a="c-min" data-v="${i}" data-d="5" aria-label="5 minutes more">+</button></div></div><div>${settings}</div></div>
    <button class="btn" data-a="c-done" data-v="${i}">${ic('check','sm')}Log early <span class="logamt"><span data-clog="${i}">${cardioLogMin(it)}</span> min</span></button>
  </div>`;
}

function popularFor(type){
  if(type==='full') return FULL.map(id=>exOf(id));
  if(type==='arms') return ARMS.map(id=>exOf(id));
  if(['push','pull','legs','cardio'].includes(type)) return EX.filter(e=>e.c===type).sort((a,b)=>a.p-b.p).slice(0,5);
  const l=String(TYPES[type]||'').toLowerCase(), res=[]; if(/upper/.test(l)) return EX.filter(e=>e.c==='push'||e.c==='pull').sort((a,b)=>a.p-b.p).slice(0,6);
  if(/lower/.test(l)) return EX.filter(e=>e.c==='legs').sort((a,b)=>a.p-b.p).slice(0,5);
  for(const [re,rx] of [[/chest/,/chest/i],[/back/,/lat|back|trap/i],[/shoulder/,/delt|shoulder/i],[/arm/,/bicep|tricep|forearm|brachialis/i],[/core|abs/,/abs|core|oblique/i],[/glute/,/glute/i]]) if(re.test(l)) res.push(...EX.filter(e=>e.c!=='cardio'&&rx.test(String(e.m).split('·')[0])).sort((a,b)=>a.p-b.p).slice(0,4));
  return [...new Map(res.map(e=>[e.id,e])).values()].slice(0,6);
}

function sampleWorkouts(p){
  const out=[]; const today=new Date(); today.setHours(18,0,0,0);
  for(let d=42; d>=1; d--){ const day=new Date(today.getTime()-d*864e5), k=dayKey(day), plan=p.plans[k]; if(!plan||!plan.length||d%9===4) continue;
    const prog=(42-d)/42;
    out.push({id:'w_s'+d,kind:'workout',acct:'sample',startedAt:day.getTime(),endedAt:day.getTime()+(55+d%15)*60000,day:k,type:p.split[k],title:`${DAYN[k]} ${TYPES[p.split[k]]}`,unit:'lb',
      items:plan.map((pl,j)=>{ const w=Math.round((num(pl.weight)*(0.85+0.15*prog))/5)*5; return {exId:pl.exId,equip:pl.equip,cardio:false,repMin:pl.repMin,repMax:pl.repMax,
        sets:[0,1,2].map(i=>{ const r=pl.repMax-i-((d+j)%4===0?2:0); return {w:String(w),r:String(r),st:r>=pl.repMin?'ok':'fail'}; })}; })}); }
  return out.reverse();
}

    cols.forEach(([l,val],i)=>{ const cx=96+i*320; txt(l.toUpperCase(),26,700,1560,{align:'left',x:cx,font:T,ls:4,color:sub}); txt(val,54,800,1625,{align:'left',x:cx}); });
    txt(`${day} · ${date}`,32,600,1720,{align:'left',x:96,font:T,color:sub}); mark(1840);
  } else if(sh.style===3){ // rowboats
    const n=Math.max(1,Math.round(v/(ROWBOAT[unit]||150)));
    txt('I lifted',72,800,720,{color:sub}); big(fmtN(n),'',300,1010); txt(n===1?'rowboat':'rowboats',120,900,1150,{color:acc,ls:-3}); txt('today.',58,700,1240,{color:sub});
    txt(`${wt} ${unit} · ${dur} · ${day}`,44,700,1420); txt(`One rowboat ≈ ${ROWBOAT[unit]} ${unit}`,30,600,1480,{font:T,color:sub}); txt(date,32,600,1540,{font:T,color:sub}); mark(1820);
  } else { // weight first
    txt('I LIFTED',34,700,860,{font:T,ls:6,color:sub}); big(wt,unit,230,1080);
    txt(`in ${dur}`,72,800,1230); txt(day,52,700,1310,{color:sub}); txt(date,34,600,1370,{font:T,color:sub}); mark(1820);
  }
}
// Public post with the chosen overlay: the portrait photo with the whole story overlay scaled to fit (nothing cropped)
async function portraitWithOverlay(pump){ try{ const im=await loadImg(pump), W=im.width, H=im.height, c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d'); x.drawImage(im,0,0,W,H);
  const o=document.createElement('canvas'); o.width=1080; o.height=1920; const sh=S.sheet, bg=sh.bg; sh.bg='clear'; await drawOverlayInto(o); sh.bg=bg;
  const k=Math.min(H/1920,W/1080), ow=1080*k, oh=1920*k; x.drawImage(o,(W-ow)/2,(H-oh)/2,ow,oh); let q=.92, u=c.toDataURL('image/jpeg',q); while(u.length>850000&&q>.6){ q-=.06; u=c.toDataURL('image/jpeg',q); } return u; }catch(e){ return null; } }
async function overlayBlob(){ const c=document.createElement('canvas'); c.width=1080; c.height=1920; await drawOverlayInto(c); return new Promise(r=>c.toBlob(b=>r(b),'image/png')); }
async function shareOrSave(blob,preferShare){
  const name=`boats-${(S.sheet&&S.sheet.bg==='photo')?'story':'overlay'}-${dateKey()}.png`;
  if(preferShare){ try{ const f=new File([blob],name,{type:'image/png'}); if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f]}); return; } }catch(e){ if(e&&e.name==='AbortError') return; } }
  try{ const dl=window.claude&&claude.use?await claude.use('downloads'):null;
    if(dl){ try{ await dl.save({filename:name,data:blob}); toast(preferShare?'Saved. Open Instagram or Snapchat and add it from your photos.':'Saved'); }catch(e){ if(e&&e.code==='declined') return; toast('Could not save here. Long-press the preview to save it.'); } return; } }catch(e){}
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },2000); toast('Downloaded'); }catch(e){ toast('Could not save here. Long-press the preview to save it.'); }
}

/* ---------- clock ---------- */
function autoFinishCardio(it){ const m=num(it.min)||20; it.tEl=m*60000; it.tRun=0; it.tAlert=true; it.sets[0].w=String(m); it.sets[0].st='ok'; it.kcal=cardioKcal(it,m);
  restDone(); if(Pf.vibrate) buzz(); if(Pf.flash) flashScreen(); Store.save(); if(S.route==='session') render(); toast(`${exOf(it.exId).n} done · ${m} min logged · about ${it.kcal} kcal`); maybeCelebrate(); }
function tick(){
  if(Pf&&Pf.active&&checkIdle()){ render(); }
  if(Pf && Pf.active && Pf.active.startedAt && !Pf.active.pausedAt){ const s=fmtUp(elapsed(Pf.active)); document.querySelectorAll('[data-timer]').forEach(n=>n.textContent=s); }
  if(Pf&&Pf.active) Pf.active.items.forEach((it,i)=>{ if(!it.cardio||!it.tRun) return; const target=(num(it.min)||20)*60000, el=cardioEl(it);
    if(el>=target){ autoFinishCardio(it); return; }
    if(S.route!=='session') return;
    const t=document.querySelector(`[data-cleft="${i}"]`); if(t) t.textContent=fmtClock(target-el);
    const r=document.querySelector(`[data-cring="${i}"]`); if(r){ const C=2*Math.PI*52; r.setAttribute('stroke-dashoffset',C*(1-Math.min(1,el/target))); }
    const lg=document.querySelector(`[data-clog="${i}"]`); if(lg) lg.textContent=cardioLogMin(it); });
  if(S.rest){
    const left=S.rest.until-Date.now();
    if(left<=0){ S.rest=null; restDone(); if(Pf.vibrate) buzz(); if(Pf.flash) flashScreen(); if(S.route==='session'||S.route==='app') render(); toast('Rest over. Next set.'); return; }
    const r=document.querySelector('[data-rest]'); if(r) r.textContent=fmtClock(left);
    const sec=Math.ceil(left/1000); if(sec<=3&&sec>=1&&S.rest.tick!==sec){ S.rest.tick=sec; tickCue(); }
    const f=document.getElementById('restfill'); if(f) f.style.width=Math.max(0,100*left/(S.rest.total*1000))+'%';
  }
}
setInterval(tick,1000);

  try{ if(Pf&&isStandalone()&&!Pf.installedAt){ Pf.installedAt=Date.now(); Store.save(); } }catch(e){}
  try{ const qp=new URLSearchParams(location.search).get('p'); if(qp&&Pf&&Pf.onboarded){ history.replaceState(null,'',location.pathname); const [pu,pi]=qp.split(':'); let n=0; const t=setInterval(()=>{ if((((Social.posts||{})[pu]||{}).items||[]).some(x=>x.id===pi)||++n>40){ clearInterval(t); A['posts-open'](qp); } },250); } }catch(e){}
  try{ const qu=new URLSearchParams(location.search).get('u'); if(qu&&Pf&&Pf.onboarded){ history.replaceState(null,'',location.pathname); let n=0; const t=setInterval(()=>{ if((Social.people||{})[qu]||++n>40){ clearInterval(t); if(qu!==Social.me()) A.person(qu); else A.tab('me'); } },250); } }catch(e){}
  if(Pf&&Pf.pinReload){ S.pinNow=Pf.pinReload; Pf.pinReload=null; Store.save(); }

  if(window.boatsClaimName&&Pf&&Pf.onboarded&&Pf.username&&Pf.nameClaimed!==Pf.username) window.boatsClaimName(Pf.username,Pf.nameClaimed).then(r=>{ if(r==='ok'){ Pf.nameClaimed=Pf.username; Store.save(); } else if(r==='taken'){ S.nameTaken=true; Pf.nameAt=0; render(); } });
});
