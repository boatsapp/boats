name: Founding Crew numbers
on:
  workflow_dispatch:
    inputs:
      order:
        description: "Optional: usernames in order for #001, #002, ... (comma separated). Leave empty to just list."
        required: false
        default: ""
permissions:
  contents: read
jobs:
  founders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock firebase-admin@12
      - name: Write service account
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
      - name: Founders
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          ORDER: ${{ inputs.order }}
        run: node tools/founders.mjs
