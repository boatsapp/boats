name: Sync feedback
on:
  workflow_dispatch:
    inputs:
      all_users:
        description: "Include every user's feedback (not just the owner's)"
        type: boolean
        default: false
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: read
  issues: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock firebase-admin@12
      - name: Write service account
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
      - name: Copy feedback into issues
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          GH_TOKEN: ${{ github.token }}
          OWNER_EMAIL: swaizyofficial@gmail.com
          ALL_USERS: ${{ inputs.all_users || 'false' }}
        run: node tools/sync-feedback.mjs
