name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build site
        run: |
          cd web && npm ci
          cd .. && python3 build-web.py
      - name: Write service account
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
      - name: Deploy site and database rules
        working-directory: web
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx --yes firebase-tools@13 deploy --only hosting,firestore:rules --project boats-40d0f --non-interactive
      - name: Check live site
        run: |
          sleep 5
          for u in https://boats-40d0f.web.app/ https://carrytheboats.app/; do
            echo "== $u"; curl -sSI "$u" | grep -i -E "^HTTP|cache-control" || true
            curl -sS "$u" | grep -o "const BUILD = '[^']*'" || echo "build not found"
            curl -sS "$u" | grep -c 'data-a="admin"' || true
          done
          echo "== sign-in handler on carrytheboats.app"; curl -sS -o /dev/null -w "%{http_code}\n" https://carrytheboats.app/__/auth/handler
          curl -sS -o /dev/null -w "%{http_code}\n" https://carrytheboats.app/__/firebase/init.json
          echo "== policy links in raw home page"; curl -sS https://carrytheboats.app/ | grep -o 'href="/privacy"' | head -1
          echo "== search console file"; curl -sS https://carrytheboats.app/google4f9316b88d005ff8.html
