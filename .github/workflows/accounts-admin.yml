name: Accounts admin
on:
  workflow_dispatch:
    inputs:
      action:
        description: "list or delete"
        required: true
        default: "list"
      uid:
        description: "Account id to delete (only for delete)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock firebase-admin@12
      - name: Write service account
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
      - name: Accounts
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          ACTION: ${{ inputs.action }}
          UID: ${{ inputs.uid }}
        run: node tools/accounts-admin.mjs
